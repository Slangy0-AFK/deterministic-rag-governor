services:
  ollama:
    image: ollama/ollama:0.6.8
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-models:
    image: ollama/ollama:0.6.8
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull $${RAG_MODEL:-$${OLLAMA_MODEL:-llama3.2}} && ollama pull $${RAG_EMBEDDING_MODEL:-$${EMBED_MODEL:-nomic-embed-text}}"

  web:
    depends_on:
      ollama-models:
        condition: service_completed_successfully
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./governor.db:/app/governor.db
      - ./chroma_db:/app/chroma_db
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434

volumes:
  ollama: