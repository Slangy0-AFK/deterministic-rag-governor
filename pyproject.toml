[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-rag-governor"
version = "0.1.0"
description = "Deterministic policy enforcement and audit for RAG agents"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Deterministic RAG Governor contributors"}]
dynamic = ["dependencies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[project.urls]
Repository = "https://github.com/Slangy0-AFK/deterministic-rag-governor"
Issues = "https://github.com/Slangy0-AFK/deterministic-rag-governor/issues"

[tool.setuptools]
py-modules = ["governor"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
